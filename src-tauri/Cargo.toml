[package]
name = "ssd-sentinel"
version = "1.11.0"
edition = "2021"
description = "Cross-platform SSD/HDD health, diagnostics, benchmark, surface repair and recovery suite"
license = "MIT"

[lib]
name = "ssd_sentinel_core"
path = "src/lib.rs"

[[bin]]
name = "ssd-sentinel"
path = "src/main.rs"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-notification", "dep:tauri-plugin-single-instance"]
native-gui = ["dep:eframe", "dep:egui", "dep:egui_plot", "dep:rfd", "dep:image"]

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
rusqlite = { version = "0.43", features = ["bundled"] }
roxmltree = "0.21"
tempfile = "3"
getrandom = "0.3"
same-file = "1"
uuid = { version = "1", features = ["v4"] }
eframe = { version = "0.31", optional = true, default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = { version = "0.31", optional = true, default-features = false, features = ["default_fonts"] }
egui_plot = { version = "0.31", optional = true }
rfd = { version = "0.15", optional = true, default-features = false, features = ["xdg-portal", "async-std"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
io-uring = "0.7"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
ureq = { version = "3", features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Memory",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_Services",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_Properties",
  "Win32_Globalization",
  "Win32_Networking_WinHttp",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
