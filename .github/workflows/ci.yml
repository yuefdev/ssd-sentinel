name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check-and-test:
    name: Windows Rust + Tauri + Frontend + UI Smoke CI
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Guard TR/EN localization (no Turkish leaking into English)
        run: npm run check:i18n

      - name: Run TypeScript unit tests
        run: npm test

      - name: Type-check & Vite build
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Prepare resource directory for Tauri build script
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "tools\smartmontools\bin", "tools\smartmontools\doc" | Out-Null
          if (-not (Test-Path "tools\smartmontools\bin\smartctl.exe")) {
            New-Item -ItemType File -Force -Path "tools\smartmontools\bin\smartctl.exe" | Out-Null
          }
          if (-not (Test-Path "tools\smartmontools\doc\COPYING.txt")) {
            New-Item -ItemType File -Force -Path "tools\smartmontools\doc\COPYING.txt" | Out-Null
          }

      - name: Run Clippy lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust unit & integration tests (core, no-default-features)
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --no-fail-fast

      - name: Run Rust unit & integration tests (full desktop feature)
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast

      - name: Export synthetic Rust fixture & run Playwright UI smoke
        run: |
          cargo run --manifest-path src-tauri/Cargo.toml --no-default-features --example export_fixture -- results/rust-fixture.json
          node tools/smoke_tauri.mjs results/smoke-ci

      - name: Upload UI smoke screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-ci-failure
          path: results/smoke-ci
          if-no-files-found: ignore

  vhdx-ntfs-integration:
    name: Real NTFS VHDX Junction & Rollback Integration
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run NTFS VHDX cross-volume integration harness
        shell: pwsh
        run: pwsh -NoProfile -File tools/vhdx_integration_test.ps1

  security-and-supply-chain:
    name: Supply-Chain Security Audit (Cargo & npm)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Audit runtime npm dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run RustSec vulnerability audit
        run: cargo audit -f src-tauri/Cargo.lock

  linux-native-ci:
    name: Linux Native Rust GUI + CLI + i18n + Packaging CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Guard TR/EN localization and run TS checks
        run: |
          npm run check:i18n
          npm test
          npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Clippy lints (Linux native-gui + core + tests)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features --features native-gui --all-targets -- -D warnings

      - name: Run Rust unit & integration tests (core, no-default-features)
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --no-fail-fast

      - name: Run Rust unit & integration tests (native-gui)
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --features native-gui --no-fail-fast

      - name: Build Linux release binary (native-gui)
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --locked --no-default-features --features native-gui

      - name: Verify zero forbidden C UI/SSL/D-Bus shared-library links
        run: |
          ldd src-tauri/target/release/ssd-sentinel
          if ldd src-tauri/target/release/ssd-sentinel | grep -Eiq "webkit|gtk|adwaita|qt|ssl|dbus|ayatana"; then
            echo "Forbidden runtime library link detected"
            exit 1
          fi

      - name: Run CLI fixture smoke test
        run: |
          ./src-tauri/target/release/ssd-sentinel --version
          ./src-tauri/target/release/ssd-sentinel --cli status --snapshot-dir src-tauri/tests/fixtures --json >/dev/null

      - name: Verify Linux packaging scripts and build .deb package
        run: |
          bash -n packaging/linux/*.sh
          ./packaging/linux/build-deb.sh
          dpkg-deb --info dist/ssd-sentinel_*.deb
