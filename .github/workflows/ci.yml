name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  RAYON_NUM_THREADS: "1"

jobs:
  check-and-test:
    name: Windows Rust + Tauri + Frontend CI
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install npm dependencies
        run: npm ci

      - name: Run TypeScript unit tests
        run: npm test

      - name: Type-check & Vite build
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Clippy lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -j 1 -- -D warnings

      - name: Run Rust unit & integration tests (core, no-default-features)
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --no-fail-fast -j 1

      - name: Run Rust unit & integration tests (full desktop feature)
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast -j 1
